<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearth Core</title>
<style>body{font:16px/1.6 system-ui;margin:0;background:#f7f3ed;color:#28231f}.wrap{max-width:900px;margin:auto;padding:40px 20px}h1{font-size:42px;margin-bottom:0}.card{background:#fff;border:1px solid #e7ded4;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 8px 30px #5b42220d}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border:1px solid #d8c9bb;border-radius:10px}button{background:#352b23;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.muted{color:#75685e}</style></head>
<body><main class="wrap"><h1>Hearth Core</h1><p class="muted">让 AI 被唤醒、选择行动或保持沉默，并留下可审计轨迹。</p>
<section class="card"><h2>连接</h2><input id="token" type="password" placeholder="输入 .env 里的 ADMIN_TOKEN"><button onclick="loadEvents()">读取事件流水</button></section>
<section class="card"><h2>手动唤醒</h2><textarea id="reason" placeholder="例如：到了喝水时间"></textarea><button onclick="wake()">触发一次安全演示</button><pre id="result"></pre></section>
<section class="card"><h2>最近事件</h2><pre id="events">尚未读取</pre></section></main>
<script>const headers=()=>({'authorization':'Bearer '+token.value,'content-type':'application/json'});async function wake(){const r=await fetch('/api/wake',{method:'POST',headers:headers(),body:JSON.stringify({source:'dashboard',reason:reason.value,payload:{suggested_action:'note',message:reason.value}})});result.textContent=JSON.stringify(await r.json(),null,2);loadEvents()}async function loadEvents(){const r=await fetch('/api/events?limit=50',{headers:headers()});events.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
